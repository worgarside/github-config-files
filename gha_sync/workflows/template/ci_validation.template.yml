---
name: 'CI: Validation'

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  ci-validation:
    name: 'CI: Validation'
    uses: worgarside/github-config-files/.github/workflows/__ci-validation.yml@0.5.1
    with:
      build-branch: '{{ build_branch }}'
      build-type: '{{ build_type }}'
      node-build-directory: '{{ node_build_directory }}'
      python-version: '{{ python_version }}'
      unit-test: '{{ unit_test }}'
    secrets: inherit
