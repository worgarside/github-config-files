---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - '{{ source_glob }}'
      - '!{{ version_file_glob }}'

  workflow_dispatch:
    inputs:
      force-deployment:
        description: Force a release at a specific level, bypassing normal detection
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@main
    with:
      python-version: '{{ python_version }}'
      force-deployment: '{{ force_deployment_expr }}'
    secrets: inherit
