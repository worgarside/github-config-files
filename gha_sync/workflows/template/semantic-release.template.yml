---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - '{{ source_glob }}'
      - '!{{ version_file_glob }}'

  workflow_dispatch:
    inputs:
      force-deployment:
        description: >-
          Version component to force, or auto to use semantic commit parsing.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@0.5.2
    with:
      python-version: '{{ python_version }}'
      force-deployment: '{{ force_deployment_expr }}'
    secrets: inherit
