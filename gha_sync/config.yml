---
# yamllint disable rule:line-length

group:
  # All Repos
  # PR-hygiene workflows are synced as individual files with an explicit
  # per-entry deleteOrphaned: true, so removing one of these from GCF still
  # cascades a delete downstream. This is deliberately NOT a directory sync:
  # repos that have moved to the PSR-based pattern (semantic-release.yml,
  # prek-hooks.yml, prek-autoupdate.yml, unit-tests.yml, etc.) keep bespoke,
  # non-synced files in this same .github/workflows/ directory, and a
  # directory-level orphan-delete would wipe those out too.
  - files:
      - .github/CODEOWNERS
      - .github/dependabot.yml
      - source: gha_sync/workflows/all/auto-create-pr.yml
        dest: .github/workflows/auto-create-pr.yml
        deleteOrphaned: true
      - source: gha_sync/workflows/all/manage-pr.yml
        dest: .github/workflows/manage-pr.yml
        deleteOrphaned: true
      - source: gha_sync/workflows/all/manage-repo-labels.yml
        dest: .github/workflows/manage-repo-labels.yml
        deleteOrphaned: true
      - source: gha_sync/workflows/all/set-pr-auto-merge.yml
        dest: .github/workflows/set-pr-auto-merge.yml
        deleteOrphaned: true
    repos: |
      worgarside/addon-item-warehouse-api
      worgarside/addon-item-warehouse-website
      worgarside/addon-yas-209-bridge
      worgarside/esphome
      worgarside/home-assistant
      worgarside/home-assistant-appdaemon
      worgarside/home-assistant-config-validator
      worgarside/led-matrix-controller
      worgarside/plant-monitor
      worgarside/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worgarside/smart-mini-crt-interface
      worgarside/very-slow-movie-player
      worgarside/wg-scripts
      worgarside/wg-utilities

  # Prek Auto-Update - identical for every repo on the prek/PSR pattern, no
  # per-repo variation, so this is a plain synced file rather than a
  # per-repo template entry.
  - files:
      - source: gha_sync/workflows/all/prek-autoupdate.yml
        dest: .github/workflows/prek-autoupdate.yml
        deleteOrphaned: true
    repos: |
      worgarside/esphome
      worgarside/home-assistant
      worgarside/home-assistant-appdaemon
      worgarside/home-assistant-config-validator
      worgarside/led-matrix-controller
      worgarside/plant-monitor
      worgarside/pre-commit-hooks-dependency-sync
      worgarside/wg-scripts
      worgarside/wg-utilities

  # Release Drafter - only the repos still on the legacy label-based release
  # mechanism (__ci_validation.yml / __ci_deployment.yml) need this. Repos
  # migrated to python-semantic-release generate their own GitHub releases
  # directly and must NOT receive this file.
  - files:
      - source: gha_sync/configs/release-drafter.yml
        dest: .github/release-drafter.yml
    repos: |
      worgarside/addon-item-warehouse-api
      worgarside/addon-item-warehouse-website
      worgarside/addon-yas-209-bridge
      worgarside/python-template
      worgarside/smart-mini-crt-interface
      worgarside/very-slow-movie-player

  # No Custom Labels
  # The only exclusion is `home-assistant`, which has its own repo_labels.yml:
  # https://github.com/worgarside/home-assistant/blob/main/.github/repo_labels.yml
  - files:
      - .github/labeler.yml
      - .github/repo_labels.yml
    repos: |
      worgarside/addon-item-warehouse-api
      worgarside/addon-item-warehouse-website
      worgarside/addon-yas-209-bridge
      worgarside/esphome
      worgarside/home-assistant-appdaemon
      worgarside/home-assistant-config-validator
      worgarside/led-matrix-controller
      worgarside/plant-monitor
      worgarside/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worgarside/smart-mini-crt-interface
      worgarside/very-slow-movie-player
      worgarside/wg-scripts
      worgarside/wg-utilities

  # Standard .yamllint
  - files:
      - .yamllint
    repos: |
      worgarside/addon-item-warehouse-api
      worgarside/addon-yas-209-bridge
      worgarside/esphome
      worgarside/home-assistant-appdaemon
      worgarside/home-assistant-config-validator
      worgarside/led-matrix-controller
      worgarside/plant-monitor
      worgarside/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worgarside/smart-mini-crt-interface
      worgarside/very-slow-movie-player
      worgarside/wg-scripts

  # Standard CI Validation with version bump in pyproject.toml
  # Only for repos still on the legacy label-based release mechanism - repos
  # migrated to python-semantic-release have their own bespoke
  # unit-tests.yml/semantic-release.yml and must NOT receive this.
  - files:
      - source: gha_sync/workflows/template/ci_validation.template.yml
        dest: .github/workflows/ci_validation.yml
        template:
          build_branch: ${{ github.ref }}
          python_version: '3.12'
    repos: |
      worgarside/addon-item-warehouse-api
      worgarside/addon-yas-209-bridge
      worgarside/python-template
      worgarside/smart-mini-crt-interface
      worgarside/very-slow-movie-player

  # Standard CI Deployment with version bump in pyproject.toml
  # Same caveat as Standard CI Validation above.
  - files:
      - source: gha_sync/workflows/template/ci_deployment.template.yml
        dest: .github/workflows/ci_deployment.yml
        template:
          build_branch: ${{ github.ref }}
          python_version: '3.12'
          release_tag: ${{ needs.ci-validation.outputs.release-tag }}
          update_pyproject_toml: 'true'
    repos: |
      worgarside/python-template

worgarside/addon-item-warehouse-api:
  - source: gha_sync/workflows/template/ci_deployment.template.yml
    dest: .github/workflows/ci_deployment.yml
    template:
      build_branch: ${{ github.ref }}
      pr_merged: ${{ github.event.pull_request.merged }}
      python_version: '3.12'
      release_tag: ${{ needs.ci-validation.outputs.release-tag }}
      update_pyproject_toml: 'true'
      update_yaml_file_path: item_warehouse_api/config.yaml

worgarside/addon-item-warehouse-website:
  - source: gha_sync/workflows/repo/addon-item-warehouse-website/
    dest: .github/workflows/
  - source: gha_sync/workflows/template/ci_validation.template.yml
    dest: .github/workflows/ci_validation.yml
    template:
      build_branch: ${{ github.ref }}
      build_type: node
      node_build_directory: item_warehouse_website
  - source: gha_sync/workflows/template/ci_deployment.template.yml
    dest: .github/workflows/ci_deployment.yml
    template:
      build_branch: ${{ github.ref }}
      pr_merged: ${{ github.event.pull_request.merged }}
      build_type: node
      node_build_directory: item_warehouse_website
      release_tag: ${{ needs.ci-validation.outputs.release-tag }}
      update_pyproject_toml: 'false'
      update_json_file_path: item_warehouse_website/package.json
      update_yaml_file_path: item_warehouse_website/config.yaml

worgarside/addon-yas-209-bridge:
  - source: gha_sync/workflows/template/ci_deployment.template.yml
    dest: .github/workflows/ci_deployment.yml
    template:
      build_branch: ${{ github.ref }}
      pr_merged: ${{ github.event.pull_request.merged }}
      python_version: '3.12'
      release_tag: ${{ needs.ci-validation.outputs.release-tag }}
      update_pyproject_toml: 'true'
      update_yaml_file_path: yas_209_bridge/config.yaml

worgarside/esphome:
  # No python-version: this repo has no Python project at all - __prek-hooks.yml
  # skips the uv setup/sync steps entirely when python-version is empty.
  # semantic-release.yml stays bespoke/unmanaged here: it has a submodule-deploy
  # job (bumping this repo into worgarside/home-assistant) that doesn't fit the
  # shared template.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: ''

worgarside/frigate-config:
  - source: gha_sync/workflows/all/auto-create-pr.yml
    dest: .github/workflows/auto-create-pr.yml
    deleteOrphaned: true

worgarside/home-assistant:
  # semantic-release.yml stays bespoke/unmanaged here: unlike every other repo
  # it intentionally has no `paths:` filter (changes anywhere in the HA config
  # should trigger a release check) plus a commit-message guard instead of a
  # path exclusion, since its version bump only touches pyproject.toml.
  - source: gha_sync/workflows/repo/home-assistant/
    dest: .github/workflows/
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'

worgarside/home-assistant-appdaemon:
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      source_glob: apps/**
      # version_variables only writes pyproject.toml (repo root, not under
      # apps/**), so this exclusion is a harmless no-op, not a real target.
      version_file_glob: pyproject.toml
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worgarside/home-assistant-config-validator:
  - source: gha_sync/workflows/repo/home-assistant-config-validator/
    dest: .github/workflows/
  - source: gha_sync/workflows/template/codspeed.template.yml
    dest: .github/workflows/codspeed.yml
    template:
      cache_key: venv-${{ hashFiles(env.CACHE_FILE) }}
      python_version: '3.12'
      token: ${{ secrets.CODSPEED_TOKEN }}
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.12'
      source_dir: home_assistant_config_validator
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      source_glob: home_assistant_config_validator/**
      version_file_glob: home_assistant_config_validator/__init__.py
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worgarside/led-matrix-controller:
  - source: gha_sync/workflows/template/codspeed.template.yml
    dest: .github/workflows/codspeed.yml
    template:
      cache_key: venv-${{ hashFiles(env.CACHE_FILE) }}
      python_version: '3.11'
      token: ${{ secrets.CODSPEED_TOKEN }}
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.11'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.11'
      source_dir: led_matrix_controller
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.11'
      source_glob: led_matrix_controller/**
      version_file_glob: led_matrix_controller/__init__.py
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worgarside/plant-monitor:
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.11'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.11'
      source_glob: src/**
      # version_variables only writes pyproject.toml (repo root, not under
      # src/**), so this exclusion is a harmless no-op, not a real target.
      version_file_glob: pyproject.toml
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worgarside/pre-commit-hooks-dependency-sync:
  # Naming note: this repo's OWN identity keeps "pre-commit" in its name and
  # hook id since other repos still reference it by that exact name - only
  # its internal CI tooling uses prek naming.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.13'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.13'
      source_glob: pre_commit_hooks_dependency_sync/**
      version_file_glob: pre_commit_hooks_dependency_sync/__init__.py
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worgarside/wg-scripts:
  # semantic-release.yml stays bespoke/unmanaged here: its release job pushes
  # via an SSH deploy key (branch-ruleset bypass) with the key setup running
  # inline inside the release job itself, which a shared reusable workflow
  # has no seam to inject into.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.14'

worgarside/wg-utilities:
  # semantic-release.yml stays bespoke/unmanaged here: it has PyPI-publish and
  # docs build/deploy jobs chained after release, which don't fit the shared
  # release-only template.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.12'
      source_dir: wg_utilities

worgarside/smart-mini-crt-interface:
  - source: gha_sync/workflows/template/ci_deployment.template.yml
    dest: .github/workflows/ci_deployment.yml
    template:
      build_branch: ${{ github.ref }}
      path_to___version___file: smart_mini_crt_interface/__init__.py
      python_version: '3.12'
      release_tag: ${{ needs.ci-validation.outputs.release-tag }}
      update_pyproject_toml: 'true'

worgarside/very-slow-movie-player:
  - source: gha_sync/workflows/template/ci_deployment.template.yml
    dest: .github/workflows/ci_deployment.yml
    template:
      build_branch: ${{ github.ref }}
      path_to___version___file: very_slow_movie_player/__init__.py
      python_version: '3.12'
      release_tag: ${{ needs.ci-validation.outputs.release-tag }}
      update_pyproject_toml: 'true'
