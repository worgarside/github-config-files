---
name: '"Test" Runner'

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      test-branch:
        type: string
        description: Branch to run tests on
        required: true
      python-version:
        description: The Python version to build with
        required: true
        type: string

jobs:
  test:
    name: Unit Tests
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - 3.13-dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test-branch }}

      - name: Load cached .local
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local
          key: dotlocal-${{ runner.os }}-${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Cached Venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python 3.13 Dependencies
        if: matrix.python-version == '3.13-dev'
        run: sudo apt-get install libxml2-dev libxslt-dev

      - name: Install Dependencies
        id: install-dependencies
        # if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        continue-on-error: ${{ endsWith(matrix.python-version, '-dev')}}
        run: poetry install --sync --all-extras --with test

      - name: Run Tests
        id: unit-tests
        if: steps.install-dependencies.outcome == 'success'
        continue-on-error: true
        run: poetry run pytest --cov=./ --cov-report=xml

      - name: Upload `coverage.xml` Artifact
        if: >-
          matrix.python-version == inputs.python-version &&
          steps.install-dependencies.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.run_id }}
          path: ./coverage.xml

      - name: Upload coverage to Codecov
        if: >-
          matrix.python-version == inputs.python-version &&
          steps.install-dependencies.outcome == 'success'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check on UT failures
        if: >-
          steps.unit-tests.outcome != 'success' &&
          !endsWith(matrix.python-version, '-dev') &&
          steps.install-dependencies.outcome == 'success'
        run: exit 1
