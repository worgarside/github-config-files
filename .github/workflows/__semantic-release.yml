---
name: '"Semantic Release" Runner'

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python version to release with
        required: true
        type: string
      force-deployment:
        description: >-
          Forces a release at a specific level ("patch", "minor", "major"),
          bypassing normal commit-based detection. Pass an empty string (the
          caller's own "auto" choice) for normal behaviour - workflow_call
          inputs can't be typed as a dropdown, so the choice UI lives in each
          calling workflow's own workflow_dispatch input.
        required: false
        type: string
    outputs:
      released:
        description: Whether a release was made
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: The tag of the release
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: The version of the release
        value: ${{ jobs.release.outputs.version }}
    secrets:
      DEPLOY_KEY:
        description: SSH deploy key used to push release commits and tags
        required: true
      WORGARSIDE_DEV_TOKEN:
        description: GitHub token used by Python Semantic Release
        required: true

jobs:
  release:
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log Inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n$INPUTS\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          # Python Semantic Release runs in Docker, so checkout's temporary
          # SSH key is not visible when it pushes the release.
          persist-credentials: false

      - name: Configure release deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        # yamllint disable rule:line-length
        run: |
          # The key must live inside the workspace because the PSR action only
          # mounts this directory. Relative paths work both on the runner and
          # in the action container at /github/workspace.
          install -m 700 -d .git/ssh
          printf '%s\n' "$DEPLOY_KEY" > .git/ssh/deploy_key
          chmod 600 .git/ssh/deploy_key
          ssh-keyscan -t ed25519,rsa github.com > .git/ssh/known_hosts
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config --local core.sshCommand "ssh -i .git/ssh/deploy_key -o UserKnownHostsFile=.git/ssh/known_hosts -o IdentitiesOnly=yes"
          git ls-remote --heads origin "${GITHUB_REF_NAME}"
        # yamllint enable rule:line-length

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Python Semantic Release
        id: python-semantic-release
        # yamllint disable-line rule:line-length
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          git_committer_name: worgarside-dev
          git_committer_email: worgarside.dev@gmail.com
          config_file: pyproject.toml
          verbosity: 2
          force: ${{ inputs.force-deployment }}
